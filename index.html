<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <!-- user-scalable=no: sul telefono il doppio tocco non fa zoom sulla pagina -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Gioco</title>
  <style>
    /* Il gioco occupa tutta la finestra; Phaser lo ridimensiona mantenendo le proporzioni */
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
    /* touch-action: none = il dito controlla il gioco, non scorre né ingrandisce la pagina */
    body { touch-action: none; }
  </style>
  <!-- Phaser: la libreria che gestisce grafica, input e ciclo di gioco -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/4.1.0/phaser.min.js"></script>
</head>
<body>
  <!-- L'ordine conta: prima i numeri, poi i pezzi, poi la scena, infine l'avvio.
       Il "?v=" è il numero di versione: cambiandolo a ogni aggiornamento
       il browser scarica i file nuovi invece di usare quelli vecchi salvati. -->
  <script src="config.js?v=27"></script>
  <script src="lingua.js?v=27"></script>
  <script src="abilita.js?v=27"></script>
  <script src="benedizioni.js?v=27"></script>
  <script src="statistiche.js?v=27"></script>
  <script src="controlli.js?v=27"></script>
  <script src="flowfield.js?v=27"></script>
  <script src="arena.js?v=27"></script>
  <script src="nemici.js?v=27"></script>
  <script src="boss.js?v=27"></script>
  <script src="arco.js?v=27"></script>
  <script src="lame.js?v=27"></script>
  <script src="scia.js?v=27"></script>
  <script src="consumabili.js?v=27"></script>
  <script src="fulmine.js?v=27"></script>
  <script src="round.js?v=27"></script>
  <script src="interfaccia.js?v=27"></script>
  <script src="scelta.js?v=27"></script>
  <script src="pausa.js?v=27"></script>
  <script src="vita.js?v=27"></script>
  <script src="combattimento.js?v=27"></script>
  <script src="progressi.js?v=27"></script>
  <script src="partita.js?v=27"></script>
  <script src="main.js?v=27"></script>
</body>
</html>
